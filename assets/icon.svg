<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alts Forever">
  <title>Alts Forever</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a2c"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#66cc99" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#2f8f63" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f8f63" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66cc99" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#2a7a55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#66cc99" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f5e6"/>
      <stop offset="1" stop-color="#8fd1b0"/>
    </linearGradient>

    <linearGradient id="middle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcbd"/>
      <stop offset="1" stop-color="#5aa985"/>
    </linearGradient>

    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bb894"/>
      <stop offset="1" stop-color="#3a7d5e"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Tres personajes, uno delante de otro -->
  <g stroke="#06120d" stroke-width="8" stroke-linejoin="round">
    <circle cx="146" cy="196" r="52" fill="url(#back)"/>
    <path d="M62 360 C 62 290, 100 262, 146 262 C 192 262, 230 290, 230 360 Z" fill="url(#back)"/>

    <circle cx="366" cy="196" r="52" fill="url(#back)"/>
    <path d="M282 360 C 282 290, 320 262, 366 262 C 412 262, 450 290, 450 360 Z" fill="url(#back)"/>

    <circle cx="256" cy="176" r="66" fill="url(#middle)"/>
    <path d="M150 392 C 150 300, 198 262, 256 262 C 314 262, 362 300, 362 392 Z" fill="url(#front)"/>
    <circle cx="256" cy="176" r="66" fill="url(#front)"/>
  </g>

  <!-- Moneda -->
  <circle cx="366" cy="392" r="46" fill="#06120d" fill-opacity="0.9"/>
  <circle cx="366" cy="392" r="36" fill="url(#gold)"/>
  <circle cx="366" cy="392" r="22" fill="none" stroke="#b37f00" stroke-width="5"/>

  <!-- Destellos -->
  <g fill="#e6fff2">
    <path d="M430 52 L436 72 L456 78 L436 84 L430 104 L424 84 L404 78 L424 72 Z" fill-opacity="0.8"/>
    <path d="M86 410 L91 425 L106 430 L91 435 L86 450 L81 435 L66 430 L81 425 Z" fill-opacity="0.5"/>
  </g>
</svg>
